name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;29.0.14206865

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v6

      - name: Check version matches tag
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "versionName $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          apk="app/build/renamedApks/release/DashDeck-$VERSION.apk"
          sha256sum "$apk" | sed 's#app/build/renamedApks/release/##' > "$apk.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          name: DashDeck ${{ env.VERSION }}
          body_path: notes.md
          files: |
            app/build/renamedApks/release/DashDeck-${{ env.VERSION }}.apk
            app/build/renamedApks/release/DashDeck-${{ env.VERSION }}.apk.sha256
